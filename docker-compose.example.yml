x-main-healthcheck: &main-healthcheck
  test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5000/readyz | grep -q '\"status\":\"ready\"'"]
  interval: 15s
  timeout: 5s
  retries: 5
  start_period: 30s

x-worker-healthcheck: &worker-healthcheck
  test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:6000/readyz | grep -q '\"status\":\"ready\"'"]
  interval: 15s
  timeout: 5s
  retries: 5
  start_period: 30s

services:
  go-shkeeper:
    build: .
    ports:
      - "127.0.0.1:5000:5000"
    healthcheck: *main-healthcheck
    environment:
      SHKEEPER_LISTEN: ":5000"
      MARIADB_DATABASE_URL: "mariadb://shkeeper:${MARIADB_PASSWORD}@mariadb:3306/shkeeper"
      DB_MAX_OPEN_CONNS: "${SHKEEPER_DB_MAX_OPEN_CONNS:-48}"
      DB_MAX_IDLE_CONNS: "${SHKEEPER_DB_MAX_IDLE_CONNS:-16}"
      DB_CONN_MAX_IDLE_SECONDS: "${DB_CONN_MAX_IDLE_SECONDS:-180}"
      DB_CONN_MAX_LIFETIME_SECONDS: "${DB_CONN_MAX_LIFETIME_SECONDS:-1800}"
      SECRET_KEY: "${SECRET_KEY}"
      SHKEEPER_CRYPTOS: "${SHKEEPER_CRYPTOS:-BTC,BTC-LIGHTNING,LTC,DOGE,FIRO,FIRO-SPARK,TRX,USDT,USDC,BNB,BNB-USDT,SOL,SOLANA-USDT,SOLANA-USDC,SOLANA-PYUSD,XMR,XRP}"
      BTC_API_SERVER_HOST: "btc-worker"
      BTC_SERVER_PORT: "6000"
      BTC_USERNAME: "${BTC_USERNAME}"
      BTC_PASSWORD: "${BTC_PASSWORD}"
      LTC_API_SERVER_HOST: "ltc-worker"
      LTC_SERVER_PORT: "6000"
      LTC_USERNAME: "${LTC_USERNAME}"
      LTC_PASSWORD: "${LTC_PASSWORD}"
      DOGE_API_SERVER_HOST: "doge-worker"
      DOGE_SERVER_PORT: "6000"
      DOGE_USERNAME: "${DOGE_USERNAME}"
      DOGE_PASSWORD: "${DOGE_PASSWORD}"
      FIRO_API_SERVER_HOST: "firo-worker"
      FIRO_SERVER_PORT: "6000"
      FIRO_USERNAME: "${FIRO_USERNAME}"
      FIRO_PASSWORD: "${FIRO_PASSWORD}"
      BTC_LIGHTNING_API_SERVER_HOST: "btc-lightning-worker"
      BTC_LIGHTNING_SERVER_PORT: "6000"
      BTC_LIGHTNING_USERNAME: "${BTC_LIGHTNING_USERNAME}"
      BTC_LIGHTNING_PASSWORD: "${BTC_LIGHTNING_PASSWORD}"
      TRON_API_SERVER_HOST: "tron-worker"
      TRON_API_SERVER_PORT: "6000"
      TRX_USERNAME: "${TRON_USERNAME}"
      TRX_PASSWORD: "${TRON_PASSWORD}"
      USDT_USERNAME: "${TRON_USERNAME}"
      USDT_PASSWORD: "${TRON_PASSWORD}"
      USDC_USERNAME: "${TRON_USERNAME}"
      USDC_PASSWORD: "${TRON_PASSWORD}"
      BNB_API_SERVER_HOST: "bnb-worker"
      BNB_SERVER_PORT: "6000"
      BNB_USERNAME: "${BNB_USERNAME}"
      BNB_PASSWORD: "${BNB_PASSWORD}"
      MONERO_API_SERVER_HOST: "xmr-worker"
      MONERO_SERVER_PORT: "6000"
      MONERO_USERNAME: "${MONERO_USERNAME}"
      MONERO_PASSWORD: "${MONERO_PASSWORD}"
      XRP_API_SERVER_HOST: "xrp-worker"
      XRP_SERVER_PORT: "6000"
      XRP_USERNAME: "${XRP_USERNAME}"
      XRP_PASSWORD: "${XRP_PASSWORD}"
      SOLANA_API_SERVER_HOST: "solana-worker"
      SOLANA_SERVER_PORT: "6000"
      SOLANA_USERNAME: "${SOLANA_USERNAME}"
      SOLANA_PASSWORD: "${SOLANA_PASSWORD}"
    depends_on:
      - mariadb
      - btc-worker
      - ltc-worker
      - doge-worker
      - firo-worker
      - btc-lightning-worker
      - tron-worker
      - bnb-worker
      - solana-worker
      - xmr-worker
      - xrp-worker

  btc-worker:
    build: .
    command: ["/app/chain-worker"]
    healthcheck: *worker-healthcheck
    environment:
      CHAIN_MODULE: "BTC"
      MARIADB_DATABASE_URL: "mariadb://shkeeper:${MARIADB_PASSWORD}@mariadb:3306/shkeeper"
      DB_MAX_OPEN_CONNS: "${WORKER_DB_MAX_OPEN_CONNS:-16}"
      DB_MAX_IDLE_CONNS: "${WORKER_DB_MAX_IDLE_CONNS:-8}"
      DB_CONN_MAX_IDLE_SECONDS: "${DB_CONN_MAX_IDLE_SECONDS:-180}"
      DB_CONN_MAX_LIFETIME_SECONDS: "${DB_CONN_MAX_LIFETIME_SECONDS:-1800}"
      FULLNODE_URL: "${BTC_RPC_URL:-http://bitcoind:8332}"
      BTC_USERNAME: "${BTC_USERNAME}"
      BTC_PASSWORD: "${BTC_PASSWORD}"
      BTC_RPC_USERNAME: "${BTC_RPC_USERNAME}"
      BTC_RPC_PASSWORD: "${BTC_RPC_PASSWORD}"
    depends_on:
      - mariadb

