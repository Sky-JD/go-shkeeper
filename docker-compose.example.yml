      MONERO_DAEMON_URL: "${MONERO_DAEMON_URL:-http://monerod:18081}"
      MONERO_WALLET_RPC_URL: "${MONERO_WALLET_RPC_URL:-http://monero-wallet-rpc:18083}"
      MONERO_DAEMON_USER: "${MONERO_DAEMON_USER}"
      MONERO_DAEMON_PASS: "${MONERO_DAEMON_PASS}"
