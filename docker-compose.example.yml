      BTC_LIGHTNING_USERNAME: "${BTC_LIGHTNING_USERNAME}"
      BTC_LIGHTNING_PASSWORD: "${BTC_LIGHTNING_PASSWORD}"
      LIGHTNING_INVOICE_TTL: "${LIGHTNING_INVOICE_TTL:-604800}"
      LIGHTNING_LNURL: "${LIGHTNING_LNURL}"
      LNBITS_URL: "${LNBITS_URL}"
