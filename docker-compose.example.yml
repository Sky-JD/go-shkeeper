      ACCOUNT_PASSWORD: "${SOLANA_ACCOUNT_PASSWORD}"
      SOLANA_USERNAME: "${SOLANA_USERNAME}"
      SOLANA_PASSWORD: "${SOLANA_PASSWORD}"
      SOLANA_RPC_USERNAME: "${SOLANA_RPC_USERNAME}"
      SOLANA_RPC_PASSWORD: "${SOLANA_RPC_PASSWORD}"
      SOLANA_USDT_MINT: "${SOLANA_USDT_MINT:-Es9vMFrzaCERmJfrF4H2FYD4KCoNkY11McCe8BenwNYB}"
      SOLANA_USDT_DECIMALS: "${SOLANA_USDT_DECIMALS:-6}"
      SOLANA_USDC_MINT: "${SOLANA_USDC_MINT:-EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v}"
      SOLANA_USDC_DECIMALS: "${SOLANA_USDC_DECIMALS:-6}"
      SOLANA_PYUSD_MINT: "${SOLANA_PYUSD_MINT:-2b1kV6DkPAnxd5ixfnxCpjxmKwqjjaYmCZfHsFu24GXo}"
      SOLANA_PYUSD_DECIMALS: "${SOLANA_PYUSD_DECIMALS:-6}"
      SOLANA_PYUSD_TOKEN_PROGRAM: "${SOLANA_PYUSD_TOKEN_PROGRAM:-TokenzQdBNbLqP5VEhdkAS6EPFLC1PHnBqCXEpPxuEb}"
