x-main-healthcheck: &main-healthcheck
  test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5000/readyz | grep -q '\"status\":\"ready\"'"]
  interval: 15s
  timeout: 5s
  retries: 5
  start_period: 30s

x-worker-healthcheck: &worker-healthcheck
  test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:6000/readyz | grep -q '\"status\":\"ready\"'"]
  interval: 15s
  timeout: 5s
  retries: 5
  start_period: 30s

x-evm-deposit-env: &evm-deposit-env
  EVM_DEPOSIT_SCAN_ENABLED: "${EVM_DEPOSIT_SCAN_ENABLED:-true}"
  EVM_DEPOSIT_SCAN_INTERVAL_SECONDS: "${EVM_DEPOSIT_SCAN_INTERVAL_SECONDS:-20}"
  EVM_DEPOSIT_SCAN_MAX_INVOICE_AGE_SECONDS: "${EVM_DEPOSIT_SCAN_MAX_INVOICE_AGE_SECONDS:-7200}"
  EVM_DEPOSIT_SCAN_BATCH_SIZE: "${EVM_DEPOSIT_SCAN_BATCH_SIZE:-200000}"
  EVM_DEPOSIT_SCAN_BLOCK_STEP: "${EVM_DEPOSIT_SCAN_BLOCK_STEP:-500}"
  EVM_DEPOSIT_SCAN_MIN_CONFIRMATIONS: "${EVM_DEPOSIT_SCAN_MIN_CONFIRMATIONS:-2}"
  EVM_DEPOSIT_SCAN_START_MARGIN_SECONDS: "${EVM_DEPOSIT_SCAN_START_MARGIN_SECONDS:-600}"
  EVM_DEPOSIT_DISPATCH_INTERVAL_SECONDS: "${EVM_DEPOSIT_DISPATCH_INTERVAL_SECONDS:-2}"
  EVM_DEPOSIT_DISPATCH_BATCH_SIZE: "${EVM_DEPOSIT_DISPATCH_BATCH_SIZE:-200}"
  EVM_DEPOSIT_DISPATCH_CONCURRENCY: "${EVM_DEPOSIT_DISPATCH_CONCURRENCY:-8}"
  EVM_DEPOSIT_EVENT_MAX_ATTEMPTS: "${EVM_DEPOSIT_EVENT_MAX_ATTEMPTS:-20}"
  SHKEEPER_API_BASE_URL: "${SHKEEPER_API_BASE_URL:-http://go-shkeeper:5000/api/v1}"

services:
  go-shkeeper:
    image: ${GO_SHKEEPER_IMAGE:-go-shkeeper:local}
    build:
      context: ..
    restart: unless-stopped
    ports:
      - "${SHKEEPER_HOST:-127.0.0.1}:${SHKEEPER_PORT:-5000}:5000"
    healthcheck: *main-healthcheck
    environment:
      SHKEEPER_LISTEN: ":5000"
      MARIADB_DATABASE_URL: "mariadb://shkeeper:${MARIADB_PASSWORD}@mariadb:3306/shkeeper"
      DB_MAX_OPEN_CONNS: "${SHKEEPER_DB_MAX_OPEN_CONNS:-48}"
      DB_MAX_IDLE_CONNS: "${SHKEEPER_DB_MAX_IDLE_CONNS:-16}"
      DB_CONN_MAX_IDLE_SECONDS: "${DB_CONN_MAX_IDLE_SECONDS:-180}"
