services:
  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: "${MARIADB_ROOT_PASSWORD:-change-root-password}"
      MARIADB_DATABASE: "shkeeper"
      MARIADB_USER: "shkeeper"
      MARIADB_PASSWORD: "${MARIADB_PASSWORD:-change-db-password}"
    ports:
      - "${MARIADB_HOST:-127.0.0.1}:${MARIADB_PORT:-3306}:3306"
    volumes:
      - quickstart-mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p$${MARIADB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  go-shkeeper:
    build: .
    ports:
      - "${SHKEEPER_HOST:-127.0.0.1}:${SHKEEPER_PORT:-5000}:5000"
    environment:
      SHKEEPER_LISTEN: ":5000"
      MARIADB_DATABASE_URL: "mariadb://shkeeper:${MARIADB_PASSWORD:-change-db-password}@mariadb:3306/shkeeper"
      SECRET_KEY: "${SECRET_KEY:-change-cookie-secret}"
      SHKEEPER_CRYPTOS: "${SHKEEPER_CRYPTOS:-USDT}"
      SCHEDULER_ENABLED: "${SCHEDULER_ENABLED:-false}"
      DB_MAX_OPEN_CONNS: "${DB_MAX_OPEN_CONNS:-12}"
      DB_MAX_IDLE_CONNS: "${DB_MAX_IDLE_CONNS:-4}"
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5000/readyz | grep -q '\"status\":\"ready\"'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  quickstart-mariadb-data:
